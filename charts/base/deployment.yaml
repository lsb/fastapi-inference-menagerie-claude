apiVersion: apps/v1
kind: Deployment
metadata:
  name: model-service
  labels:
    app: model-service
    model: placeholder
spec:
  replicas: 1
  selector:
    matchLabels:
      app: model-service
  template:
    metadata:
      labels:
        app: model-service
        model: placeholder
    spec:
      serviceAccountName: model-service
      containers:
      - name: model
        image: placeholder:latest
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: MODEL_GCS_PATH
          value: "gs://model-zoo/placeholder"
        - name: MODEL_NAME
          value: "placeholder"
        - name: DEVICE
          value: "cuda:0"
        - name: CUDA_VISIBLE_DEVICES
          value: "0"
        - name: LOG_LEVEL
          value: "INFO"
        resources:
          requests:
            cpu: "2"
            memory: "4Gi"
            nvidia.com/gpu: "1"
          limits:
            cpu: "4"
            memory: "8Gi"
            nvidia.com/gpu: "1"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
      nodeSelector:
        accelerator: nvidia-l4