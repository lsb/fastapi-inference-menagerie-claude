[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "model-zoo-fastapi"
version = "0.1.0"
description = "FastAPI inference menagerie for ML models on Kubernetes"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    { name = "Model Zoo Team", email = "team@example.com" },
]
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "click>=8.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "sse-starlette>=1.8.0",
    "prometheus-client>=0.19.0",
    "httpx>=0.25.0",
    "torch>=2.1.0",
    "torchvision>=0.16.0",
    "transformers>=4.36.0",
    "pillow>=10.1.0",
    "numpy>=1.24.0",
    "jinja2>=3.1.2",
    "pyyaml>=6.0.1",
    "gcsfs>=2023.12.0",
    "google-cloud-storage>=2.13.0",
    "kubernetes>=28.1.0",
    "rich>=13.7.0",
    "python-multipart>=0.0.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "black>=23.11.0",
    "ruff>=0.1.6",
    "mypy>=1.7.0",
    "types-pyyaml>=6.0.12",
    "types-requests>=2.31.0",
]

[project.scripts]
zoo = "cli.main:app"

[tool.setuptools.packages.find]
include = ["cli*", "services*"]
exclude = ["tests*", "docs*", "scripts*", "charts*", "docker*"]

[tool.black]
line-length = 88
target-version = ['py39', 'py310', 'py311']
include = '\.pyi?$'

[tool.ruff]
line-length = 88
target-version = "py39"
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by black)
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_equality = true

[[tool.mypy.overrides]]
module = [
    "transformers.*",
    "torchvision.*",
    "sse_starlette.*",
    "prometheus_client.*",
    "gcsfs.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers"
testpaths = ["tests"]
markers = [
    "unit: Unit tests that don't require external dependencies",
    "e2e: End-to-end tests that require k3d cluster", 
    "slow: Tests that take more than 10 seconds",
    "asyncio: Async tests using asyncio",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["cli", "services"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if __name__ == .__main__.:",
    "raise AssertionError",
    "raise NotImplementedError",
]