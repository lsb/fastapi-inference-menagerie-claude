  #   if: github.event_name == 'release'
  #   
  #   steps:
  #   - uses: actions/checkout@v4
  #   
  #   - name: Set up Python
  #     uses: actions/setup-python@v4
  #     with:
  #       python-version: ${{ env.PYTHON_VERSION }}
  #   
  #   - name: Install build dependencies
  #     run: |
  #       python -m pip install --upgrade pip
  #       pip install build twine
  #   
  #   - name: Update version in pyproject.toml
  #     run: |
  #       VERSION="${{ github.event.release.tag_name }}"
  #       VERSION_NO_V="${VERSION#v}"
  #       sed -i "s/version = \"0.1.0\"/version = \"$VERSION_NO_V\"/" pyproject.toml
  #   
  #   - name: Build package
  #     run: python -m build
  #   
  #   - name: Check package
  #     run: twine check dist/*
  #   
  #   - name: Publish to PyPI
  #     env:
  #       TWINE_USERNAME: __token__
  #       TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
  #     run: twine upload dist/*

  update-helm-charts:
    runs-on: ubuntu-latest
    needs: build-and-publish
    if: github.event_name == 'release'
    
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract version
      id: version
      run: |
        VERSION="${{ github.event.release.tag_name }}"
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "VERSION_NO_V=${VERSION#v}" >> $GITHUB_OUTPUT
    
    - name: Update Helm chart versions
      run: |
        # Update image tags in base manifests
        sed -i "s|image: placeholder:latest|image: ${{ env.REGISTRY }}/${{ github.repository }}/MODEL_NAME:${{ steps.version.outputs.VERSION }}|" \
          charts/base/deployment.yaml
        
        # Create version-specific overlay
        mkdir -p charts/overlays/${{ steps.version.outputs.VERSION_NO_V }}
        cat > charts/overlays/${{ steps.version.outputs.VERSION_NO_V }}/kustomization.yaml << EOF
        apiVersion: kustomize.config.k8s.io/v1beta1
        kind: Kustomization
        
        namespace: model-zoo
        
        resources:
        - ../../base
        
        images:
        - name: placeholder
          newName: ${{ env.REGISTRY }}/${{ github.repository }}/PLACEHOLDER
          newTag: ${{ steps.version.outputs.VERSION }}
        
        commonLabels:
          version: ${{ steps.version.outputs.VERSION_NO_V }}
        EOF
    
    - name: Commit chart updates
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add charts/
        git commit -m "Update charts for release ${{ steps.version.outputs.VERSION }}" || exit 0
        git push

  security-scan-release:
    runs-on: ubuntu-latest
    needs: build-and-publish
    
    strategy:
      matrix:
        model: [clip, grounding_sam, qwen_vl]
    
    steps:
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${{ github.event.release.tag_name }}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
    
    - name: Run Trivy vulnerability scanner
      uses: aquasecurity/trivy-action@master
      with:
        image-ref: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.model }}:${{ steps.version.outputs.VERSION }}
        format: 'table'
        exit-code: '1'
        ignore-unfixed: true
        vuln-type: 'os,library'
        severity: 'CRITICAL,HIGH'

  notify-release:
    runs-on: ubuntu-latest
    needs: [build-and-publish, update-helm-charts]
    if: always() && github.event_name == 'release'
    
    steps:
    - name: Notify Slack
      if: success()
      uses: 8398a7/action-slack@v3
      with:
        status: success
        text: |
          🚀 New release published: ${{ github.event.release.tag_name }}
          
          📦 Docker images available:
          • CLIP: ghcr.io/${{ github.repository }}/clip:${{ github.event.release.tag_name }}
          • Grounding SAM: ghcr.io/${{ github.repository }}/grounding_sam:${{ github.event.release.tag_name }}
          • Qwen VL: ghcr.io/${{ github.repository }}/qwen_vl:${{ github.event.release.tag_name }}
          
          🐍 Install from source: pip install git+https://github.com/${{ github.repository }}@${{ github.event.release.tag_name }}
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
    
    - name: Notify on failure
      if: failure()
      uses: 8398a7/action-slack@v3
      with:
        status: failure
        text: |
          ❌ Release ${{ github.event.release.tag_name }} failed!
          
          Please check the GitHub Actions logs for details.
      env:
        SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}