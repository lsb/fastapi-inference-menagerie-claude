name: Release

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v1.0.0)'
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.11"

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [clip, grounding_sam, qwen_vl]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3
    
    - name: Log in to GitHub Container Registry
      uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Extract version
      id: version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.version }}"
        else
          VERSION="${{ github.event.release.tag_name }}"
        fi
        echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
        echo "VERSION_NO_V=${VERSION#v}" >> $GITHUB_OUTPUT
    
    - name: Generate Dockerfile
      run: |
        python docker/build.py ${{ matrix.model }} \
          --gpu --cpu --output-dir build/
    
    - name: Build and push GPU image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: build/Dockerfile.${{ matrix.model }}.gpu
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.model }}:${{ steps.version.outputs.VERSION }}
          ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.model }}:gpu-${{ steps.version.outputs.VERSION }}
          ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.model }}:latest
        cache-from: type=gha
        cache-to: type=gha,mode=max
    
    - name: Build and push CPU image
      uses: docker/build-push-action@v5
      with:
        context: .
        file: build/Dockerfile.${{ matrix.model }}.cpu
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.model }}:cpu-${{ steps.version.outputs.VERSION }}
          ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.model }}:cpu-latest
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # PyPI publishing is disabled until we're ready to publish
  # Uncomment this job when ready to publish to PyPI
  # publish-python-package:
