name: CD

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_run:
    workflows: ["CI"]
    branches: [ main ]
    types: [ completed ]

env:
  REGISTRY: ghcr.io
  PYTHON_VERSION: "3.11"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event.workflow_run.conclusion == 'success'
    environment: staging
    
    strategy:
      matrix:
        model: [clip, grounding_sam, qwen_vl]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Configure GCP credentials
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
    
    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials ${{ vars.GKE_CLUSTER }} \
          --zone ${{ vars.GKE_ZONE }} \
          --project ${{ vars.GCP_PROJECT }}
    
    - name: Deploy to staging
      run: |
        zoo deploy ${{ matrix.model }} \
          --namespace staging-zoo \
          --registry ${{ env.REGISTRY }}/${{ github.repository }} \
          --gcs-path gs://${{ vars.MODEL_BUCKET }}/staging/${{ matrix.model }}/latest/ \
          --node-selector environment=staging
      env:
        ZOO_PREFIX: staging
    
    - name: Wait for deployment
      run: |
        kubectl wait --for=condition=available \
          deployment/staging-${{ matrix.model }} \
          -n staging-zoo --timeout=600s
    
    - name: Run smoke tests
      run: |
        CLUSTER_IP=$(kubectl get service staging-${{ matrix.model }} -n staging-zoo -o jsonpath='{.spec.clusterIP}')
        kubectl run test-pod --rm -i --restart=Never --image=curlimages/curl -- \
          curl -f http://$CLUSTER_IP/health

  e2e-staging:
    runs-on: ubuntu-latest
    needs: deploy-staging
    if: github.ref == 'refs/heads/main'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    
    - name: Configure GCP credentials
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
    
    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials ${{ vars.GKE_CLUSTER }} \
          --zone ${{ vars.GKE_ZONE }} \
          --project ${{ vars.GCP_PROJECT }}
    
    - name: Run end-to-end tests
      run: |
        pytest tests/e2e/ -v -m "e2e" \
          --staging-namespace=staging-zoo \
          --tb=short
      timeout-minutes: 15

  deploy-production:
    runs-on: ubuntu-latest
    needs: e2e-staging
    if: startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    strategy:
      matrix:
        model: [clip, grounding_sam, qwen_vl]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Configure GCP credentials
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_PROD_SA_KEY }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
    
    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials ${{ vars.GKE_PROD_CLUSTER }} \
          --zone ${{ vars.GKE_PROD_ZONE }} \
          --project ${{ vars.GCP_PROJECT }}
    
    - name: Deploy to production
      run: |
        zoo deploy ${{ matrix.model }} \
          --namespace production-zoo \
          --registry ${{ env.REGISTRY }}/${{ github.repository }} \
          --gcs-path gs://${{ vars.MODEL_BUCKET }}/production/${{ matrix.model }}/${{ github.ref_name }}/ \
          --node-selector environment=production \
          --replicas 3
      env:
        ZOO_PREFIX: prod
    
    - name: Wait for deployment
      run: |
        kubectl wait --for=condition=available \
          deployment/prod-${{ matrix.model }} \
          -n production-zoo --timeout=600s
    
    - name: Verify deployment
      run: |
        kubectl get pods -n production-zoo -l app=prod-${{ matrix.model }}
        zoo logs ${{ matrix.model }} --namespace production-zoo --tail 50

  create-release:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: startsWith(github.ref, 'refs/tags/v')
    
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
    
    - name: Generate changelog
      id: changelog
      run: |
        # Generate changelog from git commits
        PREVIOUS_TAG=$(git describe --tags --abbrev=0 HEAD~1 2>/dev/null || echo "")
        if [ -n "$PREVIOUS_TAG" ]; then
          CHANGES=$(git log $PREVIOUS_TAG..HEAD --pretty=format:"- %s" --no-merges)
        else
          CHANGES=$(git log --pretty=format:"- %s" --no-merges)
        fi
        
        # Save to output
        echo "CHANGES<<EOF" >> $GITHUB_OUTPUT
        echo "$CHANGES" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create GitHub Release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ github.ref_name }}
        release_name: Release ${{ github.ref_name }}
        body: |
          ## Changes in this release
          
          ${{ steps.changelog.outputs.CHANGES }}
          
          ## Docker Images
          
          All models have been built and published to:
          - `ghcr.io/${{ github.repository }}/clip:${{ github.ref_name }}`
          - `ghcr.io/${{ github.repository }}/grounding_sam:${{ github.ref_name }}`
          - `ghcr.io/${{ github.repository }}/qwen_vl:${{ github.ref_name }}`
          
          ## Deployment
          
          This release has been automatically deployed to production.
        draft: false
        prerelease: ${{ contains(github.ref_name, 'rc') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}

  rollback-on-failure:
    runs-on: ubuntu-latest
    needs: deploy-production
    if: failure() && startsWith(github.ref, 'refs/tags/v')
    environment: production
    
    strategy:
      matrix:
        model: [clip, grounding_sam, qwen_vl]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ env.PYTHON_VERSION }}
        cache: 'pip'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: Configure GCP credentials
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_PROD_SA_KEY }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
    
    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials ${{ vars.GKE_PROD_CLUSTER }} \
          --zone ${{ vars.GKE_PROD_ZONE }} \
          --project ${{ vars.GCP_PROJECT }}
    
    - name: Rollback deployment
      run: |
        zoo rollback ${{ matrix.model }} --namespace production-zoo
      env:
        ZOO_PREFIX: prod
    
    - name: Notify rollback
      uses: actions/github-script@v6
      with:
        script: |
          github.rest.issues.createComment({
            issue_number: context.issue.number,
            owner: context.repo.owner,
            repo: context.repo.repo,
            body: '🚨 Production deployment failed and has been rolled back for model: ${{ matrix.model }}'
          })