name: Cleanup

on:
  schedule:
    # Run cleanup every Sunday at 2 AM UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  cleanup-old-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        model: [clip, grounding_sam, qwen_vl]
    
    steps:
    - name: Delete old container images
      uses: actions/delete-package-versions@v4
      with:
        package-name: ${{ matrix.model }}
        package-type: container
        min-versions-to-keep: 10
        delete-only-untagged-versions: true

  cleanup-staging-deployments:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule'
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Configure GCP credentials
      uses: google-github-actions/auth@v1
      with:
        credentials_json: ${{ secrets.GCP_SA_KEY }}
    
    - name: Set up Cloud SDK
      uses: google-github-actions/setup-gcloud@v1
    
    - name: Configure kubectl
      run: |
        gcloud container clusters get-credentials ${{ vars.GKE_CLUSTER }} \
          --zone ${{ vars.GKE_ZONE }} \
          --project ${{ vars.GCP_PROJECT }}
    
    - name: Cleanup old staging deployments
      run: |
        # Delete deployments older than 7 days
        kubectl get deployments -n staging-zoo \
          -o jsonpath='{range .items[*]}{.metadata.name}{"\t"}{.metadata.creationTimestamp}{"\n"}{end}' | \
        while read name timestamp; do
          # Calculate age in seconds
          created=$(date -d "$timestamp" +%s)
          now=$(date +%s)
          age=$((now - created))
          
          # 7 days = 604800 seconds
          if [ $age -gt 604800 ]; then
            echo "Deleting old deployment: $name (age: $((age / 86400)) days)"
            kubectl delete deployment "$name" -n staging-zoo --ignore-not-found=true
            kubectl delete service "$name" -n staging-zoo --ignore-not-found=true
            kubectl delete hpa "$name" -n staging-zoo --ignore-not-found=true
          fi
        done

  cleanup-test-artifacts:
    runs-on: ubuntu-latest
    
    steps:
    - name: Delete old workflow runs
      uses: actions/github-script@v6
      with:
        script: |
          const { data: runs } = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'ci.yml',
            per_page: 100
          });
          
          // Keep only the latest 50 runs
          const runsToDelete = runs.workflow_runs.slice(50);
          
          for (const run of runsToDelete) {
            if (run.status === 'completed') {
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              console.log(`Deleted workflow run: ${run.id}`);
            }
          }
    
    - name: Delete old artifacts
      uses: actions/github-script@v6
      with:
        script: |
          const { data: artifacts } = await github.rest.actions.listArtifactsForRepo({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          // Delete artifacts older than 30 days
          const thirtyDaysAgo = new Date();
          thirtyDaysAgo.setDate(thirtyDaysAgo.getDate() - 30);
          
          for (const artifact of artifacts.artifacts) {
            const createdAt = new Date(artifact.created_at);
            if (createdAt < thirtyDaysAgo) {
              await github.rest.actions.deleteArtifact({
                owner: context.repo.owner,
                repo: context.repo.repo,
                artifact_id: artifact.id
              });
              console.log(`Deleted artifact: ${artifact.name} (${artifact.id})`);
            }
          }

  cleanup-caches:
    runs-on: ubuntu-latest
    
    steps:
    - name: Cleanup old caches
      uses: actions/github-script@v6
      with:
        script: |
          const { data: caches } = await github.rest.actions.getActionsCacheList({
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          });
          
          // Delete caches older than 7 days
          const sevenDaysAgo = new Date();
          sevenDaysAgo.setDate(sevenDaysAgo.getDate() - 7);
          
          for (const cache of caches.actions_caches) {
            const createdAt = new Date(cache.created_at);
            if (createdAt < sevenDaysAgo) {
              await github.rest.actions.deleteActionsCacheById({
                owner: context.repo.owner,
                repo: context.repo.repo,
                cache_id: cache.id
              });
              console.log(`Deleted cache: ${cache.key} (${cache.id})`);
            }
          }

  report-cleanup:
    runs-on: ubuntu-latest
    needs: [cleanup-old-images, cleanup-staging-deployments, cleanup-test-artifacts, cleanup-caches]
    if: always()
    
    steps:
    - name: Report cleanup results
      uses: actions/github-script@v6
      with:
        script: |
          const jobs = [
            { name: 'Container Images', status: '${{ needs.cleanup-old-images.result }}' },
            { name: 'Staging Deployments', status: '${{ needs.cleanup-staging-deployments.result }}' },
            { name: 'Test Artifacts', status: '${{ needs.cleanup-test-artifacts.result }}' },
            { name: 'Caches', status: '${{ needs.cleanup-caches.result }}' }
          ];
          
          let report = '## 🧹 Cleanup Report\n\n';
          
          for (const job of jobs) {
            const emoji = job.status === 'success' ? '✅' : job.status === 'failure' ? '❌' : '⏭️';
            report += `${emoji} **${job.name}**: ${job.status}\n`;
          }
          
          report += '\n---\n*Automated cleanup completed*';
          
          // Create an issue comment if this is part of an issue
          if (context.issue && context.issue.number) {
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: report
            });
          } else {
            console.log(report);
          }